<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dữ liệu Trực Tuyến</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #121212;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }
        h2 {
            text-align: center;
            margin-bottom: 25px;
            font-weight: 500;
            letter-spacing: 1px;
        }
        .glass-container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 20px;
            width: 95%;
            max-width: 1200px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.3);
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            white-space: nowrap;
        }
        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }
        th {
            background-color: rgba(255, 255, 255, 0.05);
            font-weight: 600;
            color: #4da8da;
        }
        tr:hover {
            background-color: rgba(255, 255, 255, 0.08);
            transition: background-color 0.2s ease;
        }
        .error {
            color: #ff5252;
            text-align: center;
            padding: 20px;
        }
    </style>
</head>
<body>

    <h2>DỮ LIỆU ĐỒNG BỘ TỪ GOOGLE SHEETS</h2>
    
    <div class="glass-container">
        <table id="dataTable">
            <!-- Dữ liệu CSV sẽ được đổ vào đây -->
            <tr><td style="text-align:center;">Đang tải dữ liệu...</td></tr>
        </table>
    </div>

    <script>
        async function loadData() {
            try {
                // Thêm timestamp vào URL để trình duyệt luôn lấy file CSV mới nhất, không bị cache
                const response = await fetch('data.csv?t=' + new Date().getTime());
                if (!response.ok) throw new Error('Không tìm thấy file data.csv');
                
                const csvText = await response.text();
                renderTable(csvText);
            } catch (error) {
                document.getElementById('dataTable').innerHTML = `<tr><td class="error">Lỗi: ${error.message}.<br>Có thể GitHub Actions chưa chạy để tạo file data.csv. Hãy kiểm tra tab Actions.</td></tr>`;
            }
        }

        function renderTable(csvText) {
            // Tách các dòng và bỏ qua các dòng trống
            const rows = csvText.split('\n').filter(row => row.trim() !== '');
            const table = document.getElementById('dataTable');
            table.innerHTML = ''; 

            rows.forEach((row, index) => {
                // Regex phân tách CSV chuyên dụng: Bỏ qua dấu phẩy nằm trong ngoặc kép
                const columns = row.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/); 
                const tr = document.createElement('tr');
                
                columns.forEach(col => {
                    const cell = index === 0 ? document.createElement('th') : document.createElement('td');
                    // Xóa ký tự ngoặc kép ở đầu/cuối chuỗi do định dạng CSV tạo ra
                    cell.textContent = col.replace(/(^"|"$)/g, '').trim();
                    tr.appendChild(cell);
                });
                
                table.appendChild(tr);
            });
        }

        // Tự động chạy hàm khi load trang
        window.onload = loadData;
    </script>
</body>
</html>
